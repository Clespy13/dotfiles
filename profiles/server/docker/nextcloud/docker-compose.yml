---
services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /nextcloud/config:/config
      - /nextcloud/data:/data
    ports:
      - 51821:80
    restart: unless-stopped

